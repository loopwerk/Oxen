{% extends "base.html" %}

{% block title %}{% if client %}{{ client }}{% else %}New client{% endif %}{% endblock %}

{% block content %}
  <h1>{% if client %}{{ client }}{% else %}New client{% endif %}</h1>

  <form method="post" class="mt-6 flex max-w-lg flex-col gap-4">
    {% csrf_token %}
    {{ form }}
    <div class="flex items-center gap-4">
      <button type="submit" class="btn-accent">Save client</button>
      <a href="{% if client %}{% url 'clients:client' client.pk %}{% else %}{% url 'clients:index' %}{% endif %}">Cancel</a>
    </div>
  </form>
{% endblock %}
