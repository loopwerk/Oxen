[project]
name = "oxen"
version = "0.9.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "babel>=2.18.0",
    "django>=6.1.3",
    "django-browser-reload>=1.21.0",
    "django-otp-webauthn>=0.10.3",
    "django-tailwind-cli>=4.9.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pycountry>=26.2.16",
    "python-dotenv>=1.2.4",
    "weasyprint>=70.0",
    "whitenoise>=6.12.0",
]

[project.urls]
Repository = "https://github.com/loopwerk/Oxen.git"
Issues = "https://github.com/loopwerk/Oxen/issues"
Changelog = "https://github.com/loopwerk/Oxen/releases"

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "djlint>=1.54.0",
    "mypy>=2.4.1",
    "ruff>=0.17.6",
]
prod = [
    "gunicorn>=27.0.1",
]

[tool.ruff]
line-length = 120
lint.extend-select = ["I", "N"]
lint.ignore = ["RUF012"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/"]
disable_error_code = ["import-untyped"]
warn_redundant_casts = true
check_untyped_defs = true

[tool.djlint]
profile = "django"
max_attribute_length = 140
max_blank_lines = 1
max_line_length = 140
indent = 2
ignore="H006,H021,H030"

[tool.django-stubs]
django_settings_module = "config.settings"